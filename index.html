<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16212e">
<title>Kelimelik Yardımcı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#16212e;color:#e8eef5;
  font-family:"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.35;
  padding:10px 10px calc(14px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
  user-select:none;
}
h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:2px 0 10px;color:#7f95ad}
h1 b{color:#f0a830;font-weight:700}
#ver{float:right;font-size:11px;color:#5d7389;font-weight:500}

#tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#1e2d3d;border:none;border-radius:7px;
  color:#93a9be;font-family:inherit;font-weight:600;font-size:13px;padding:7px 7px 7px 11px;cursor:pointer;
  text-align:left;line-height:1.15;user-select:none}
.tab i{display:block;font-style:normal;font-size:10px;opacity:.65;font-weight:500}
.tab .x{font-size:17px;line-height:1;opacity:.45;padding:3px 6px;border-radius:5px}
.tab .x:active{background:rgba(255,255,255,.14)}
.tab.on{background:#f0a830;color:#241701}
.tab.on i{opacity:.8}
.tab.on .x{opacity:.7}
.tab.add{color:#7f95ad;background:#182432;padding:7px 11px}

/* ---------- board ---------- */
#board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#0f1822;padding:4px;border-radius:8px}
.cell{
  position:relative;aspect-ratio:1;border-radius:5px;background:#28394c;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:clamp(12px,4.1vw,21px);color:#6d8399;
}
.cell.k3{background:#a89275;color:#fff}
.cell.k2{background:#82ab7f;color:#fff}
.cell.h3{background:#b9a3c4;color:#fff}
.cell.h2{background:#8fb0c4;color:#fff}
.cell.st{background:#3d5064;color:#9fb6c9}
.cell.rw{background:#e07a1f;color:#fff;box-shadow:0 0 0 2px #f0a830 inset}
.cell .bm{font-size:clamp(9px,2.9vw,14px);opacity:.95}
.cell .bm sup{font-size:.68em}
.cell.tile{background:#f3dfa0;color:#4a3115;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.cell.tile.jk{background:#efe3c4;color:#8d7a4e}
.cell .jb{position:absolute;right:1px;bottom:0;width:13px;height:13px;border-radius:50%;
  background:#37a6d9;color:#fff;font-size:9px;line-height:13px;text-align:center;font-weight:700}
#board.n15 .cell .jb{width:9px;height:9px;font-size:6px;line-height:9px}
.cell.ghost{background:#f0a830;color:#2a1a04;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.cell .pt{position:absolute;right:2px;top:1px;font-size:clamp(7px,2.2vw,10px);font-weight:700;opacity:.8}
.cell.cur{outline:3px solid #f0a830;outline-offset:-1px;z-index:2}
#board.n15{gap:2px;padding:3px}
#board.n15 .cell{border-radius:3px;font-size:clamp(8px,2.7vw,15px)}
#board.n15 .cell .bm{font-size:clamp(6px,1.9vw,10px)}
#board.n15 .cell .pt{display:none}
#board.n15 .cell .car{font-size:7px;right:1px}
.cell .car{position:absolute;right:2px;bottom:0px;font-size:10px;color:#f0a830}

/* ---------- rack ---------- */
#rackwrap{display:flex;gap:6px;align-items:center;margin:10px 0 8px}
#rack{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.slot{aspect-ratio:1;border-radius:5px;background:#28394c;border:2px dashed #3f5670;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(13px,4.4vw,22px);color:#6d8399}
.slot.full{background:#f3dfa0;border:2px solid #d8c07c;color:#4a3115}
.slot.cur{outline:3px solid #f0a830;outline-offset:-1px}

/* ---------- keyboard ---------- */
#kb{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:4px 0 10px}
.key{
  background:#25374a;border:none;border-radius:7px;color:#e8eef5;
  font-family:inherit;font-weight:600;font-size:clamp(14px,4.6vw,19px);
  padding:11px 0;cursor:pointer;
}
.key:active{background:#f0a830;color:#1d1204}
.key.util{background:#1c2a3a;color:#93a9be;font-size:14px}

/* ---------- actions ---------- */
.row{display:flex;gap:7px;margin-bottom:8px}
.btn{flex:1;border:none;border-radius:8px;padding:13px 6px;font-family:inherit;
  font-weight:700;font-size:15px;background:#25374a;color:#c9d8e6;cursor:pointer}
.btn:active{opacity:.75}
.btn.go{background:#f0a830;color:#241701;flex:2}
.btn.sm{font-size:13px;font-weight:600;padding:9px 6px;background:#1c2a3a;color:#8fa5ba}

/* ---------- results ---------- */
#trk{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:0 0 10px}
.chip{background:#1e2d3d;border-radius:5px;padding:4px 0;text-align:center;font-size:11px;font-weight:600;color:#93a9be}
.chip b{display:block;font-size:13px;color:#e8eef5;font-variant-numeric:tabular-nums}
.chip.z{opacity:.3}
.chip.lo b{color:#f0a830}
#tsum{grid-column:1/-1;font-size:12px;color:#7f95ad;padding-top:3px}
.mv{display:block}
.mv .top{display:flex;align-items:center;gap:9px}
.sub{font-size:11.5px;color:#7f95ad;margin-top:3px;letter-spacing:.01em}
#status{font-size:13px;color:#7f95ad;min-height:18px;margin:2px 0 8px}
#res{display:flex;flex-direction:column;gap:5px}
.mv{display:flex;align-items:center;gap:9px;background:#1e2d3d;border-radius:7px;padding:9px 11px;cursor:pointer;border-left:4px solid #2e4257}
.mv.sel{border-left-color:#f0a830;background:#2a3d52}
.mv .w{font-weight:700;letter-spacing:.06em;flex:1;font-size:15px}
.rw2{color:#e07a1f;font-size:12px;font-weight:700;letter-spacing:0}
.mv .s{font-weight:800;font-size:19px;color:#f0a830;font-variant-numeric:tabular-nums}
.mv .m{font-size:11px;color:#7f95ad;width:52px;text-align:right}
#loading{position:fixed;inset:0;background:#16212e;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:#7f95ad;font-size:14px;z-index:9}
.spin{width:26px;height:26px;border:3px solid #2e4257;border-top-color:#f0a830;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><span>Sözlük yükleniyor…</span></div>

<h1>5'lik <b>yardımcı</b> · 9×9 <span id="ver"></span></h1>
<div id="tabs"></div>
<div id="board"></div>

<div id="rackwrap"><div id="rack"></div></div>

<div id="trk"></div>

<div id="kb"></div>

<div class="row">
  <button class="btn go" id="bSolve">Çöz</button>
  <button class="btn" id="bApply">Oynadım</button>
</div>
<div class="row">
  <button class="btn sm" id="bMode">Mod: 5’lik 9×9</button>
  <button class="btn sm" id="bDir">Yön: →</button>
  <button class="btn sm" id="bStar">★ Ödül karesi</button>
  <button class="btn sm" id="bStrat">Analiz: Stratejik</button>
</div>
<div class="row">
  <button class="btn sm" id="bBonus">7 harf: +30</button>
  <button class="btn sm" id="bClearRack">Eli sil</button>
  <button class="btn sm" id="bClearBoard">Tahtayı sil</button>
</div>

<div id="status">Tahtaya rakibin harflerini, alta kendi elini gir.</div>
<div id="res"></div>

/* ---------- trie ---------- */
function buildTrie(words){
  const root={};
  for(const w of words){
    let n=root;
    for(let i=0;i<w.length;i++){const ch=w[i];n=n[ch]||(n[ch]={});}
    n.$=1;
  }
  return root;
}
function isWord(w){let n=ROOT;for(const ch of w){n=n[ch];if(!n)return false;}return !!n.$;}

/* ---------- render ---------- */
const $board=document.getElementById("board"),$rack=document.getElementById("rack"),
      $kb=document.getElementById("kb"),$trk=document.getElementById("trk"),$tabs=document.getElementById("tabs"),$res=document.getElementById("res"),$st=document.getElementById("status");

function bonusClass(ch){return {"3":"k3","2":"k2","c":"h3","b":"h2","*":"st"}[ch]||""}
function bonusLabel(ch){return {"3":"K<sup>3</sup>","2":"K<sup>2</sup>","c":"H<sup>3</sup>","b":"H<sup>2</sup>","*":"★"}[ch]||""}

function drawBoard(){
  $board.innerHTML="";
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement("div");
    const t=board[r][c];
    const g=ghost&&ghost.find(p=>p.r===r&&p.c===c);
    if(t){
      d.className="cell tile"+(t.j?" jk":"");
      d.innerHTML=t.l+(t.j?'<span class="jb">?</span>':'<span class="pt">'+PTS[t.l]+'</span>');
    }else if(g){
      d.className="cell ghost";
      d.innerHTML=g.L+(g.j?"":'<span class="pt">'+PTS[g.L]+'</span>');
    }else{
      const b=BONUS[r][c];
      if(stars.has(r+","+c)){d.className="cell rw";d.innerHTML='<span class="bm">★</span>'}
      else{d.className="cell "+bonusClass(b);
        if(b!==".")d.innerHTML='<span class="bm">'+bonusLabel(b)+'</span>';}
    }
    if(cur.zone==="board"&&cur.r===r&&cur.c===c){
      d.className+=" cur";
      d.innerHTML+='<span class="car">'+(dir?"↓":"→")+'</span>';
    }
    d.onclick=()=>{
      if(cur.zone==="board"&&cur.r===r&&cur.c===c){dir=1-dir;document.getElementById("bDir").textContent="Yön: "+(dir?"↓":"→");}
      cur={zone:"board",r,c,i:0};ghost=null;sel=-1;draw();
    };
    $board.appendChild(d);
  }
}
function drawRack(){
  $rack.innerHTML="";
  for(let i=0;i<7;i++){
    const d=document.createElement("div");
    const v=rack[i];
    d.className="slot"+(v?" full":"")+(cur.zone==="rack"&&cur.i===i?" cur":"");
    d.innerHTML=v?(v==="?"?"★":v+'<span class="pt">'+PTS[v]+'</span>'):"";
    d.onclick=()=>{cur={zone:"rack",i};draw()};
    $rack.appendChild(d);
  }
}
function drawTracker(){
  const s=seenCounts();let h="",seen=0;
  for(const k of AL.concat(["?"])){
    const rem=Math.max(0,TILES[k]-(s[k]||0));
    seen+=s[k]||0;
    h+='<span class="chip'+(rem===0?" z":(rem===1?" lo":""))+'">'+(k==="?"?"★":k)+"<b>"+rem+"</b></span>";
  }
  const unseen=100-seen;
  h+='<div id="tsum">'+(unseen<=7
      ? "Torba boş · rakibin elinde "+unseen+" taş (kesin biliniyor)"
      : "Görünmeyen "+unseen+" taş · torbada ~"+(unseen-7)+" · rakipte 7")+'</div>';
  $trk.innerHTML=h;
}
function draw(){drawBoard();drawRack();drawTracker();save()}

/* ---------- oyun slotları ---------- */
const SKEY2="kelimelik-yardimci-v2", SKEY="kelimelik-yardimci-v1";
const MAXG=8;
let ready=false, games=[], activeId=null, saveOk=null;
const esc=t=>String(t).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const curGame=()=>games.find(g=>g.id===activeId);

function snap(g){g.N=N;g.board=board;g.rack=rack;g.stars=[...stars];g.dir=dir;g.cur=cur;g.ts=Date.now()}
function save(){
  if(!ready)return;
  const g=curGame();if(g)snap(g);
  try{localStorage.setItem(SKEY2,JSON.stringify({v:2,active:activeId,strategic,bonus7:BONUS7,games}));saveOk=true}
  catch(e){
    if(saveOk!==false){saveOk=false;
      $st.textContent="Kayıt yapılamıyor — dosyayı doğrudan açtığın için tarayıcı izin vermiyor. Sunucuya koyup aç.";}
  }
}
function applyGame(g){
  applyMode(g.N===15?15:9);
  board=(Array.isArray(g.board)&&g.board.length===N&&g.board.every(r=>Array.isArray(r)&&r.length===N))?g.board:newBoard();
  rack=(Array.isArray(g.rack)&&g.rack.length===7)?g.rack:Array(7).fill(null);
  stars=new Set(Array.isArray(g.stars)?g.stars:[]);
  dir=g.dir?1:0;
  cur=(g.cur&&(g.cur.zone==="board"||g.cur.zone==="rack"))?g.cur:{zone:"board",r:CEN(),c:CEN(),i:0};
  if(cur.zone==="board"&&(cur.r>=N||cur.c>=N))cur={zone:"board",r:CEN(),c:CEN(),i:0};
  moves=[];sel=-1;ghost=null;$res.innerHTML="";
  document.getElementById("bDir").textContent="Yön: "+(dir?"↓":"→");
}
function switchTo(id){
  const g=curGame();if(g)snap(g);
  activeId=id;applyGame(curGame());drawTabs();draw();
}
function newGame(n,name){
  if(games.length>=MAXG){$st.textContent="En fazla "+MAXG+" oyun tutulabilir. Birini sil.";return}
  const g=curGame();if(g)snap(g);
  const id="g"+Date.now().toString(36)+Math.floor(Math.random()*99);
  games.push({id,name:name||("Oyun "+(games.length+1)),N:n,board:null,rack:null,stars:[],dir:0,cur:null,ts:Date.now()});
  activeId=id;applyGame(curGame());drawTabs();draw();
}
function delGame(id){
  games=games.filter(g=>g.id!==id);
  if(!games.length){activeId=null;newGame(9,"Oyun 1");return}
  if(activeId===id){activeId=games[0].id;applyGame(curGame())}
  drawTabs();draw();
}
function isEmptyGame(g){
  const eb=!g.board||g.board.every(r=>r.every(x=>!x));
  const er=!g.rack||g.rack.every(x=>!x);
  return eb&&er;
}
function askDelete(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  if(id===activeId)snap(g);               // aktif oyunun son hali nesneye yazılsın
  if(!isEmptyGame(g)&&!confirm('"'+g.name+'" silinsin mi? Tahtada taş var.'))return;
  delGame(id);
}
function drawTabs(){
  let h="";
  for(const g of games)
    h+='<div class="tab'+(g.id===activeId?" on":"")+'" data-id="'+g.id+'">'
      +'<span class="nm">'+esc(g.name)+'<i>'+g.N+"×"+g.N+'</i></span>'
      +'<span class="x">×</span></div>';
  if(games.length<MAXG)h+='<div class="tab add" data-new="1">＋ yeni</div>';
  $tabs.innerHTML=h;
  for(const el of $tabs.children){
    if(el.dataset.new){
      el.onclick=()=>{const nm=prompt("Rakip / oyun adı:","Oyun "+(games.length+1));if(nm===null)return;newGame(N,(nm||"").trim()||("Oyun "+(games.length+1)))};
      continue;
    }
    const id=el.dataset.id;
    const x=el.querySelector(".x");
    if(x)x.onclick=ev=>{ev.stopPropagation();askDelete(id)};
    el.onclick=()=>{
      if(id!==activeId){switchTo(id);return}
      const g=curGame();
      const nm=prompt("Oyun adı:",g.name);
      if(nm===null||!nm.trim())return;
      g.name=nm.trim();drawTabs();save();
    };
  }
}
function loadAll(){
  try{
    const raw=localStorage.getItem(SKEY2);
    if(raw){
      const d=JSON.parse(raw);
      if(Array.isArray(d.games)&&d.games.length){
        games=d.games;
        strategic=d.strategic!==false;
        if(typeof d.bonus7==="number")BONUS7=d.bonus7;
        activeId=games.some(g=>g.id===d.active)?d.active:games[0].id;
        applyGame(curGame());return true;
      }
    }
    const old=localStorage.getItem(SKEY);   // tek oyunluk eski kayıt
    if(old){
      const d=JSON.parse(old);
      strategic=d.strategic!==false;
      games=[{id:"g0",name:"Oyun 1",N:d.N===15?15:9,board:d.board,rack:d.rack,stars:d.stars||[],dir:d.dir,cur:d.cur,ts:Date.now()}];
      activeId="g0";applyGame(curGame());return true;
    }
  }catch(e){}
  return false;
}

/* ---------- keyboard ---------- */
function typeCh(ch){
  if(cur.zone==="rack"){
    rack[cur.i]=ch;
    if(cur.i<6)cur.i++;
  }else{
    board[cur.r][cur.c]={l:ch,j:false};
    if(dir===0&&cur.c<N-1)cur.c++;else if(dir===1&&cur.r<N-1)cur.r++;
    ghost=null;sel=-1;
  }
  draw();
}
function backsp(){
  if(cur.zone==="rack"){
    if(rack[cur.i]===null&&cur.i>0)cur.i--;
    rack[cur.i]=null;
  }else{
    if(!board[cur.r][cur.c]){
      if(dir===0&&cur.c>0)cur.c--;else if(dir===1&&cur.r>0)cur.r--;
    }
    board[cur.r][cur.c]=null;ghost=null;sel=-1;
  }
  draw();
}
function toggleJoker(){
  if(cur.zone==="rack"){rack[cur.i]="?";if(cur.i<6)cur.i++;draw();return}
  // imleçteki kare doluysa onu, boşsa az önce yazılan kareyi işaretle
  let r=cur.r,c=cur.c;
  if(!board[r][c]){
    const pr=dir?r-1:r, pc=dir?c:c-1;
    if(pr>=0&&pc>=0&&board[pr][pc]){r=pr;c=pc}
  }
  if(!board[r][c]){$st.textContent="Joker için önce harfi yaz ya da taşa dokun.";return}
  board[r][c].j=!board[r][c].j;
  ghost=null;sel=-1;
  $st.textContent=board[r][c].j?board[r][c].l+" joker olarak işaretlendi (0 puan).":board[r][c].l+" normal taş.";
  draw();
}
(function buildKB(){
  for(const L of AL){
    const b=document.createElement("button");
    b.className="key";b.textContent=L;b.onclick=()=>typeCh(L);
    $kb.appendChild(b);
  }
  const jk=document.createElement("button");jk.className="key util";jk.textContent="★ joker";jk.onclick=toggleJoker;$kb.appendChild(jk);
  const bs=document.createElement("button");bs.className="key util";bs.textContent="⌫ sil";bs.onclick=backsp;$kb.appendChild(bs);
})();

/* ---------- solver ---------- */
function transpose(g){const o=Array.from({length:N},()=>Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)o[c][r]=g[r][c];return o}

function genAll(bd,counts){
  const empty=bd.every(row=>row.every(x=>!x));
  const out=[];
  run(bd,BONUS,0,counts,empty,out);
  run(transpose(bd),transpose(BONUS),1,counts,empty,out);
  return out;
}
function dedupe(out){
  const best={};
  for(const m of out){const k=m.dir+"|"+m.r+"|"+m.c+"|"+m.word;if(!best[k]||best[k].score<m.score)best[k]=m}
  return Object.values(best);
}
function bestScore(bd,counts){let x=0;for(const m of genAll(bd,counts))if(m.score>x)x=m.score;return x}
function simBoard(bd,placed){const nb=bd.map(r=>r.slice());for(const p of placed)nb[p.r][p.c]={l:p.L,j:p.j};return nb}

/* ---------- harf takibi ---------- */
function seenCounts(){
  const s={};
  for(const row of board)for(const t of row)if(t){const k=t.j?"?":t.l;s[k]=(s[k]||0)+1}
  for(const v of rack)if(v)s[v]=(s[v]||0)+1;
  return s;
}
function unseenPool(){
  const s=seenCounts(),p=[];
  for(const k in TILES){const n=TILES[k]-(s[k]||0);for(let i=0;i<n;i++)p.push(k)}
  return p;
}
function drawFrom(pool,n){
  const a=pool.slice(),r=[];
  for(let i=0;i<n&&a.length;i++)r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return r;
}
/* elde kalan harflerin kalitesi: sesli/sessiz dengesi, tekrar, zor harf, joker */
function leaveVal(left){
  let v=0,vw=0,cn=0;const c={};
  for(const L of left){
    if(L==="?"){v+=11;continue}
    if(VOW.includes(L))vw++;else cn++;
    c[L]=(c[L]||0)+1;
    if("ĞJVÖFP".includes(L))v-=2.5;
  }
  for(const k in c)if(c[k]>1)v-=2*(c[k]-1);
  const n=vw+cn;
  if(n)v-=Math.abs(vw-n*0.42)*1.6;
  return v;
}

function solve(){
  const t0=performance.now();
  const counts={};
  for(const v of rack) if(v) counts[v]=(counts[v]||0)+1;
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!total){$st.textContent="Önce elindeki harfleri gir.";return}

  let list=dedupe(genAll(board,counts)).sort((a,b)=>b.score-a.score);
  const found=list.length;

  if(strategic&&list.length){
    const pool=unseenPool();
    const endgame=pool.length>0&&pool.length<=7;   // torba boş → rakibin eli KESİN olarak pool
    lastEnd=endgame;
    const pts=a=>a.reduce((x,L)=>x+(L==="?"?0:PTS[L]),0);
    const oppPts=pts(pool);
    const cands=list.slice(0,16);
    const oppRacks=[];
    if(endgame){
      const oc={};for(const L of pool)oc[L]=(oc[L]||0)+1;oppRacks.push(oc);   // tahmin yok, birebir
    }else if(pool.length>=7){
      // aynı rakip elleri tüm adaylarda kullanılır: karşılaştırma adil olsun
      for(let i=0;i<3;i++){const oc={};for(const L of drawFrom(pool,7))oc[L]=(oc[L]||0)+1;oppRacks.push(oc)}
    }
    for(const m of cands){
      const c2={...counts};
      for(const p of m.placed)c2[p.j?"?":p.L]--;
      const left=[];for(const k in c2)for(let i=0;i<c2[k];i++)left.push(k);
      m.leave=left.map(x=>x==="?"?"★":x).join("");
      m.out=left.length===0;
      if(endgame){
        // torba boş: yeni taş çekilmez. Bitirirsen rakibin kalanı sana yazılır,
        // bitiremezsen seninki hem senden düşer hem ona eklenir (iki katı etki).
        m.lv=0;
        m.end=m.out?oppPts:-2*pts(left);
      }else{m.lv=leaveVal(left);m.end=0}
      if(oppRacks.length&&!m.out){
        const nb=simBoard(board,m.placed);
        let sum=0;
        for(const oc of oppRacks)sum+=bestScore(nb,oc);
        m.opp=Math.round(sum/oppRacks.length);
      }else m.opp=0;
      m.final=Math.round(m.score+m.lv+m.end-0.6*m.opp);
    }
    cands.sort((a,b)=>b.final-a.final);
    list=cands;
  }
  moves=list.slice(0,12);
  sel=-1;ghost=null;
  renderRes(performance.now()-t0,found);
}

function run(G,B,D,counts,emptyBoard,out){
  // cross checks
  const cross=Array.from({length:N},()=>Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(G[r][c])continue;
    let up="",us=0,rr=r-1;
    while(rr>=0&&G[rr][c]){up=G[rr][c].l+up;us+=G[rr][c].j?0:PTS[G[rr][c].l];rr--}
    let dn="",ds=0;rr=r+1;
    while(rr<N&&G[rr][c]){dn+=G[rr][c].l;ds+=G[rr][c].j?0:PTS[G[rr][c].l];rr++}
    if(!up&&!dn){cross[r][c]={set:null,score:0}}
    else{const s=new Set();for(const L of AL)if(isWord(up+L+dn))s.add(L);cross[r][c]={set:s,score:us+ds}}
  }
  // anchors
  const anc=Array.from({length:N},()=>Array(N).fill(false));
  if(emptyBoard){ if(D===0){const k=CEN();anc[k][k]=true;} }
  else for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(G[r][c])continue;
    if((r>0&&G[r-1][c])||(r<N-1&&G[r+1][c])||(c>0&&G[r][c-1])||(c<N-1&&G[r][c+1]))anc[r][c]=true;
  }

  const rc={...counts};
  const avail=()=>{const a=[];for(const k in rc)if(rc[k]>0)a.push(k);return a};

  function record(r,start,end,placed){
    if(!placed.length)return;
    // hamle tahtaya bağlanmalı (ilk hamlede merkezi örtmeli)
    let conn=false;
    if(emptyBoard){const k=CEN();conn=placed.some(p=>r===k&&p.c===k)}
    else for(const p of placed){const c=p.c;
      if((c>0&&G[r][c-1])||(c<N-1&&G[r][c+1])||(r>0&&G[r-1][c])||(r<N-1&&G[r+1][c])){conn=true;break}}
    if(!conn)return;
    let w="",ms=0,wm=1,cs=0;
    for(let c=start;c<=end;c++){
      const p=placed.find(x=>x.c===c);
      if(p){
        w+=p.L;
        const b=B[r][c];let lm=1;
        if(b==="c")lm=3;else if(b==="b")lm=2;else if(b==="3")wm*=3;else if(b==="2")wm*=2;
        const pv=p.j?0:PTS[p.L]*lm;
        ms+=pv;
        const cc=cross[r][c];
        if(cc.set!==null){
          let sw=1;
          if(b==="3")sw=3;else if(b==="2")sw=2;
          cs+=(cc.score+pv)*sw;
        }
      }else{
        const t=G[r][c];w+=t.l;ms+=t.j?0:PTS[t.l];
      }
    }
    const abs=placed.map(p=>D===0?{r,c:p.c,L:p.L,j:p.j}:{r:p.c,c:r,L:p.L,j:p.j});
    let sb=0;
    if(stars.size)for(const p of abs)if(stars.has(p.r+","+p.c))sb+=STAR;
    const score=ms*wm+cs+sb+(placed.length===7?BONUS7:0);
    out.push({word:w,score,dir:D,r:D===0?r:start,c:D===0?start:r,placed:abs,used:placed.length,star:sb,bingo:placed.length===7?BONUS7:0});
  }

  function extend(node,r,c,placed,start){
    if(c>=N){if(node.$)record(r,start,N-1,placed);return}
    const t=G[r][c];
    if(t){const n2=node[t.l];if(n2)extend(n2,r,c+1,placed,start);return}
    if(node.$&&placed.length)record(r,start,c-1,placed);
    const cc=cross[r][c];
    for(const k of avail()){
      const cands=k==="?"?AL:[k];
      for(const L of cands){
        const n2=node[L];if(!n2)continue;
        if(cc.set&&!cc.set.has(L))continue;
        rc[k]--;placed.push({c,L,j:k==="?"});
        extend(n2,r,c+1,placed,start);
        placed.pop();rc[k]++;
      }
    }
  }
  // pre: önek harfleri ileri sırada; önek büyüdükçe tamamı sola kayar
  function leftPart(node,r,anchorC,limit,pre){
    const st=anchorC-pre.length;
    extend(node,r,anchorC,pre.map((p,i)=>({c:st+i,L:p.L,j:p.j})),st);
    if(limit<=0||st<=0)return;
    for(const k of avail()){
      const cands=k==="?"?AL:[k];
      for(const L of cands){
        const n2=node[L];if(!n2)continue;
        rc[k]--;pre.push({L,j:k==="?"});
        leftPart(n2,r,anchorC,limit-1,pre);
        pre.pop();rc[k]++;
      }
    }
  }

  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!anc[r][c])continue;
    if(c>0&&G[r][c-1]){
      let s=c-1;while(s>0&&G[r][s-1])s--;
      let n=ROOT,ok=true;
      for(let k=s;k<c;k++){n=n[G[r][k].l];if(!n){ok=false;break}}
      if(ok)extend(n,r,c,[],s);
    }else{
      let lim=0,cc=c-1;
      while(cc>=0&&!G[r][cc]&&!anc[r][cc]){lim++;cc--}
      leftPart(ROOT,r,c,lim,[]);
    }
  }
}

/* ---------- results ---------- */
function renderRes(ms,cnt){
  $st.textContent=cnt+" hamle · "+Math.round(ms)+" ms";
  $res.innerHTML="";
  if(!moves.length){$st.textContent="Hamle bulunamadı.";return}
  moves.forEach((m,i)=>{
    const d=document.createElement("div");
    d.className="mv"+(i===sel?" sel":"");
    let h='<div class="top"><span class="w">'+m.word+(m.star?' <span class="rw2">★+'+m.star+'</span>':'')
      +'</span><span class="m">'+(m.dir?"↓":"→")+" "+(m.r+1)+","+(m.c+1)+'</span><span class="s">'+m.score+'</span></div>';
    if(strategic&&m.final!==undefined){
      let sub;
      if(lastEnd) sub = m.out ? "OYUNU BİTİRİR · rakibin kalanı +"+m.end+" · net "+m.final
                              : "elde kalır "+m.leave+" ("+m.end+") · rakip ≈"+m.opp+" · net "+m.final;
      else sub = "elde kalır "+(m.leave||"—")+" · rakip ≈"+m.opp+" · net "+m.final;
      if(m.bingo)sub="7 harf +"+m.bingo+" · "+sub;
      h+='<div class="sub">'+sub+'</div>';
    }
    d.innerHTML=h;
    d.onclick=()=>{sel=i;ghost=m.placed;renderRes(ms,cnt);draw()};
    $res.appendChild(d);
  });
}

/* ---------- actions ---------- */
document.getElementById("bSolve").onclick=()=>{$st.textContent="hesaplanıyor…";setTimeout(solve,15)};
document.getElementById("bBonus").onclick=()=>{
  BONUS7=BONUS7===30?50:(BONUS7===50?20:(BONUS7===20?0:30));
  document.getElementById("bBonus").textContent="7 harf: +"+BONUS7;
  moves=[];sel=-1;ghost=null;$res.innerHTML="";draw();
};
document.getElementById("bStrat").onclick=()=>{
  strategic=!strategic;
  document.getElementById("bStrat").textContent="Analiz: "+(strategic?"Stratejik":"Hızlı");
  moves=[];sel=-1;ghost=null;$res.innerHTML="";
  $st.textContent=strategic?"Rakip tehdidi ve el kalitesi hesaba katılır (biraz yavaş).":"Sadece ham puan, anında sonuç.";
  draw();
};
document.getElementById("bStar").onclick=()=>{
  if(cur.zone!=="board"){$st.textContent="Önce tahtada ödül karesine dokun.";return}
  const k=cur.r+","+cur.c;
  if(stars.has(k)){stars.delete(k);$st.textContent="Ödül karesi kaldırıldı."}
  else{stars.add(k);$st.textContent="Ödül karesi: "+(cur.r+1)+". satır, "+(cur.c+1)+". sütun (+"+STAR+")"}
  moves=[];sel=-1;ghost=null;$res.innerHTML="";draw();
};
document.getElementById("bDir").onclick=()=>{dir=1-dir;document.getElementById("bDir").textContent="Yön: "+(dir?"↓":"→");draw()};
document.getElementById("bClearRack").onclick=()=>{rack=Array(7).fill(null);cur={zone:"rack",i:0};draw()};
document.getElementById("bClearBoard").onclick=()=>{
  if(!confirm("Tahta sıfırlansın mı?"))return;
  resetBoard();
};
function resetBoard(){
  board=newBoard();stars=new Set();ghost=null;moves=[];sel=-1;$res.innerHTML="";
  cur={zone:"board",r:CEN(),c:CEN(),i:0};draw();
}
function applyMode(n){
  N=n;BONUS=LAY[n].map(s=>s.split(""));
  $board.className=n===15?"n15":"";
  $board.style.gridTemplateColumns="repeat("+n+",1fr)";
  document.getElementById("bMode").textContent=n===9?"Mod: 5'lik 9×9":"Mod: Klasik 15×15";
}
function setMode(n){applyMode(n);resetBoard();const g=curGame();if(g)g.N=n;drawTabs()}
document.getElementById("bMode").onclick=()=>{
  if(board.some(r=>r.some(x=>x))&&!confirm("Tahta sıfırlanacak, devam?"))return;
  setMode(N===9?15:9);
};
document.getElementById("bApply").onclick=()=>{
  if(sel<0){$st.textContent="Önce listeden bir hamle seç.";return}
  const m=moves[sel];
  for(const p of m.placed)board[p.r][p.c]={l:p.L,j:p.j};
  for(const p of m.placed){
    const key=p.j?"?":p.L;
    const i=rack.indexOf(key);if(i>=0)rack[i]=null;
  }
  ghost=null;moves=[];sel=-1;$res.innerHTML="";
  $st.textContent=m.word+" işlendi (+"+m.score+"). Kalan harfleri tamamla.";
  cur={zone:"rack",i:rack.indexOf(null)<0?0:rack.indexOf(null)};
  draw();
};

/* ---------- boot ---------- */
(async function(){
  try{
    const bin=Uint8Array.from(atob(DICT_B64),ch=>ch.charCodeAt(0));
    const ds=new DecompressionStream("gzip");
    const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    ROOT=buildTrie(txt.split("\n"));
    document.getElementById("loading").remove();
    const resumed=loadAll();
    if(!resumed){applyMode(9);games=[{id:"g0",name:"Oyun 1",N:9,board:null,rack:null,stars:[],dir:0,cur:null,ts:Date.now()}];activeId="g0";applyGame(games[0])}
    ready=true;
    document.getElementById("bStrat").textContent="Analiz: "+(strategic?"Stratejik":"Hızlı");
    document.getElementById("bBonus").textContent="7 harf: +"+BONUS7;
    document.getElementById("ver").textContent=APPVER;
    if(resumed&&games.length>1)$st.textContent=games.length+" oyun kayıtlı. Üstteki sekmelerden geçiş yap.";
    else if(resumed)$st.textContent="Kaldığın yerden devam ediyorsun.";
    drawTabs();draw();
  }catch(e){
    document.getElementById("loading").innerHTML="Sözlük açılamadı: "+e.message+"<br>Chrome ile aç.";
  }
})();
